name: Vetted feedback
description: Maintainers only. File survey feedback after human vetting (see feedback/FEEDBACK_PLAN.md).
title: "[feedback] "
labels: ["feedback:vetted"]
body:
  - type: markdown
    attributes:
      value: |
        Use only the anonymized summary written during vetting. Do not paste raw responses, emails, or README text from unpublished packages.
  - type: input
    id: version
    attributes:
      label: Skill version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Invented content in edited copy
        - False finding
        - Missed issue
        - Report length or tone
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary (vetter's own words)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change to the skill
  - type: input
    id: responses
    attributes:
      label: Number of responses reporting this
      placeholder: "1"
  - type: checkboxes
    id: vetting
    attributes:
      label: Vetting
      options:
        - label: A maintainer read the response(s) and accepted them.
          required: true
        - label: The summary contains no confidential or identifying information.
          required: true
        - label: The respondent(s) allowed anonymized quoting, or this summary does not quote or closely paraphrase them.
          required: true
