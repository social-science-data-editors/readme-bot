name: Build skill

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build prompt and skill zip
        run: scripts/build.sh
      - name: Check generated files are up to date
        run: |
          if ! git diff --exit-code -- prompts/ feedback/questions.md; then
            echo "::error::Generated files are stale (prompt or survey table). Run scripts/build.sh and commit."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: readme-review
          path: dist/readme-review.zip
      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/readme-review.zip
