# Builds the prompt and skill zip on every push and pull request. Pull requests
# from branches of this repository (not forks) additionally get a live preview
# of the site (docs/) deployed to Cloudflare Pages, with the link posted as a
# PR comment. One-time setup: a Cloudflare Pages project named like this
# repository, and the repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. See README-DEPLOYMENT.md.

name: Build skill

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: build.sh lists approvers from git log
      - name: Build prompt and skill zip
        run: scripts/build.sh
      - name: Check generated files are up to date
        run: |
          # feedback/questions.md is regenerated by survey-questions.yml instead.
          # The approvers line is skipped: a new contributor's name cannot be in
          # the footer before their first commit exists. The next step fills it
          # in on main.
          if ! git diff --exit-code -I 'data-stamp="approvers"' -- prompts/ docs/; then
            echo "::error::Generated files (prompts/, docs/index.html) are stale. Run scripts/build.sh and commit."
            exit 1
          fi
      - name: Commit refreshed approvers on main
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "Approvers line is up to date."
            exit 0
          fi
          git diff -- docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Update approvers in site footer"
          git push origin "HEAD:main"
      - uses: actions/upload-artifact@v7
        with:
          name: readme-review
          path: dist/readme-review.zip
      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/readme-review.zip

  preview:
    # Runs after build, which verifies that the committed docs/ is current.
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # only for the PR comment
    env:
      # Pages project name = GitHub repository name
      CF_PAGES_PROJECT: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy PR preview
        id: preview
        # Forked PRs cannot read secrets, and handing a deploy token to
        # unreviewed code is a bad trade for a preview.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ./docs
            --project-name=${{ env.CF_PAGES_PROJECT }}
            --branch=pr-${{ github.event.pull_request.number }}
      - name: Publish preview link
        if: steps.preview.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.pages-deployment-alias-url }}
        run: |
          echo "📖 Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$REPO" --edit-last --create-if-none \
            --body "📖 **Preview:** $URL — commit \`${GITHUB_SHA:0:7}\`"
