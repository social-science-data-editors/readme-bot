name: Merge approved feedback

# A maintainer's approval on a feedback PR includes the response (squash-merge).
# Closing a feedback PR without merging rejects it; its branch is deleted.
on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      startsWith(github.event.pull_request.head.ref, 'feedback/response-') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'feedback:response')
    runs-on: ubuntu-latest
    steps:
      - name: Check reviewer has write access
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          perm=$(gh api "repos/${{ github.repository }}/collaborators/$REVIEWER/permission" --jq .permission)
          echo "Reviewer $REVIEWER has permission: $perm"
          case "$perm" in admin|maintain|write) ;; *) echo "::error::Approval by non-maintainer ignored"; exit 1;; esac
      - name: Check PR only touches feedback/responses/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bad=$(gh pr view ${{ github.event.pull_request.number }} -R ${{ github.repository }} --json files --jq '.files[].path' | grep -v '^feedback/responses/' || true)
          if [ -n "$bad" ]; then echo "::error::PR touches files outside feedback/responses/: $bad"; exit 1; fi
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} -R ${{ github.repository }} --squash --delete-branch

  cleanup-rejected:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == false &&
      startsWith(github.event.pull_request.head.ref, 'feedback/response-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch of rejected response
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }}" || true
