name: Pull feedback from Qualtrics

# Opens one PR per new, finished, consented Qualtrics response.
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: feedback-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    if: vars.QUALTRICS_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "readme-bot feedback"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create "feedback:response" --color 0E8A16 --description "Survey response awaiting maintainer decision" --force
      - name: Open PRs for new responses
        env:
          GH_TOKEN: ${{ github.token }}
          QUALTRICS_BASE_URL: ${{ vars.QUALTRICS_BASE_URL }}
          QUALTRICS_SURVEY_ID: ${{ vars.QUALTRICS_SURVEY_ID }}
          QUALTRICS_API_TOKEN: ${{ secrets.QUALTRICS_API_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/qualtrics_to_prs.py
