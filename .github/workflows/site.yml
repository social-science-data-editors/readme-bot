# Builds the website from docs/ (Markdown, Jupyter Book 2 / mystmd).
# - push to main: deploy to GitHub Pages (Settings → Pages → Source: GitHub Actions).
# - pull requests from branches of this repository (not forks): deploy a preview
#   to Cloudflare Pages and post the link as a PR comment. Needs the repository
#   secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and a Cloudflare Pages
#   project named like this repository. See README-DEPLOYMENT.md.

name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # GitHub Pages serves at https://<org>.github.io/<repo>, so production needs
  # BASE_URL=/<repo>. Cloudflare previews serve at the domain root: empty.
  BASE_URL: ${{ github.event_name != 'pull_request' && format('/{0}', github.event.repository.name) || '' }}
  CF_PAGES_PROJECT: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # only for the preview comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Jupyter Book
        run: pip install -r docs/requirements.txt
      - name: Build site
        working-directory: docs
        run: jupyter-book build --html --strict
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      # Forked PRs cannot read secrets, and handing a deploy token to
      # unreviewed code is a bad trade for a preview.
      - name: Deploy PR preview
        id: preview
        if: |
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ./docs/_build/html
            --project-name=${{ env.CF_PAGES_PROJECT }}
            --branch=pr-${{ github.event.pull_request.number }}
      - name: Publish preview link
        if: steps.preview.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.pages-deployment-alias-url || steps.preview.outputs.deployment-url }}
        run: |
          echo "📖 Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$REPO" --edit-last --create-if-none \
            --body "📖 **Preview:** $URL — commit \`${SHA:0:7}\`"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
