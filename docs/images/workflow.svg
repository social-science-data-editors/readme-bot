<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="info-title info-desc">
  <title id="info-title">How readme-bot works, and how your feedback changes it</title>
  <desc id="info-desc">Top row, your side: 1 your README and optional package go to 2 an AI assistant with the readme-review skill, which writes 3 a report and an optional edited copy, which 4 you check. Bottom row, maintainers' side: 5 you answer a short feedback survey, 6 each response becomes a pull request in a private repository after automated vetting, 7 maintainers approve or reject it and write skill changes, which loop back into the skill at step 2.</desc>
  <!-- Self-contained colours: this file is shown as an <img>, so it cannot see the
       page's stylesheet or dark-mode class. It keeps its own light background. -->
  <style>
    .bg { fill: #ffffff; }
    .lane { font: 700 11px system-ui, sans-serif; letter-spacing: .08em; fill: #4a545b; }
    .box-u { fill: #dcecec; stroke: #1f6f78; stroke-width: 1.5; }
    .box-m { fill: #efede6; stroke: #d9d6cc; stroke-width: 1.5; }
    .t1 { font: 700 15px system-ui, sans-serif; fill: #1d2327; }
    .t2 { font: 12.5px system-ui, sans-serif; fill: #4a545b; }
    .num { font: 700 12px system-ui, sans-serif; fill: #ffffff; }
    .numc { fill: #1f6f78; }
    .arrow { stroke: #4a545b; stroke-width: 1.6; fill: none; }
    .arrow-head { fill: #4a545b; }
    .loop { stroke: #1f6f78; stroke-dasharray: 5 4; }
    .loop-head { fill: #1f6f78; }
    .loop-t { font: 600 12.5px system-ui, sans-serif; fill: #1f6f78; }
    .stamp { fill: none; stroke: #4a545b; stroke-dasharray: 4 3; stroke-width: 1.2; }
    .stamp-t { font: 700 11px system-ui, sans-serif; letter-spacing: .1em; fill: #4a545b; }
    .stamp-s { font: 11px system-ui, sans-serif; fill: #4a545b; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="loop-head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="320" rx="10"/>

  <text class="lane" x="20" y="26">YOUR SIDE</text>
  <text class="lane" x="500" y="186">MAINTAINERS' SIDE</text>

  <!-- Top row -->
  <g>
    <rect class="box-u" x="20" y="38" width="200" height="96" rx="10"/>
    <circle class="numc" cx="42" cy="60" r="11"/><text class="num" x="42" y="64" text-anchor="middle">1</text>
    <text class="t1" x="60" y="65">Your README</text>
    <text class="t2" x="36" y="92">plus the package or a</text>
    <text class="t2" x="36" y="110">file listing (optional)</text>
  </g>
  <g>
    <rect class="box-u" x="260" y="38" width="200" height="96" rx="10"/>
    <circle class="numc" cx="282" cy="60" r="11"/><text class="num" x="282" y="64" text-anchor="middle">2</text>
    <text class="t1" x="300" y="65">Your AI assistant</text>
    <text class="t2" x="276" y="92">runs the readme-review</text>
    <text class="t2" x="276" y="110">skill or prompt file</text>
  </g>
  <g>
    <rect class="box-u" x="500" y="38" width="200" height="96" rx="10"/>
    <circle class="numc" cx="522" cy="60" r="11"/><text class="num" x="522" y="64" text-anchor="middle">3</text>
    <text class="t1" x="540" y="65">Report</text>
    <text class="t2" x="516" y="92">README-review.md</text>
    <text class="t2" x="516" y="110">+ README-ai-edited.md</text>
  </g>
  <g>
    <rect class="box-u" x="740" y="38" width="200" height="96" rx="10"/>
    <circle class="numc" cx="762" cy="60" r="11"/><text class="num" x="762" y="64" text-anchor="middle">4</text>
    <text class="t1" x="780" y="65">You check it</text>
    <text class="t2" x="756" y="92">fix your README; verify</text>
    <text class="t2" x="756" y="110">every AI edit yourself</text>
  </g>

  <!-- Bottom row -->
  <g>
    <rect class="box-u" x="740" y="198" width="200" height="96" rx="10"/>
    <circle class="numc" cx="762" cy="220" r="11"/><text class="num" x="762" y="224" text-anchor="middle">5</text>
    <text class="t1" x="780" y="225">Feedback survey</text>
    <text class="t2" x="756" y="252">~2 minutes, anonymized;</text>
    <text class="t2" x="756" y="270">answered by you, not AI</text>
  </g>
  <g>
    <rect class="box-m" x="500" y="198" width="200" height="96" rx="10"/>
    <circle class="numc" cx="522" cy="220" r="11"/><text class="num" x="522" y="224" text-anchor="middle">6</text>
    <text class="t1" x="540" y="225">Private repository</text>
    <text class="t2" x="516" y="252">one pull request per</text>
    <text class="t2" x="516" y="270">response; free text vetted</text>
  </g>
  <g>
    <rect class="box-m" x="260" y="198" width="200" height="96" rx="10"/>
    <circle class="numc" cx="282" cy="220" r="11"/><text class="num" x="282" y="224" text-anchor="middle">7</text>
    <text class="t1" x="300" y="225">Maintainers</text>
    <text class="t2" x="276" y="252">approve or reject; write</text>
    <text class="t2" x="276" y="270">the next skill version</text>
  </g>

  <!-- Stamp -->
  <g>
    <rect class="stamp" x="24" y="214" width="192" height="64" rx="8"/>
    <text class="stamp-t" x="120" y="241" text-anchor="middle">CLAUDE-GENERATED</text>
    <text class="stamp-s" x="120" y="261" text-anchor="middle">infographic · check the text</text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M222,86 L256,86" marker-end="url(#ah)"/>
  <path class="arrow" d="M462,86 L496,86" marker-end="url(#ah)"/>
  <path class="arrow" d="M702,86 L736,86" marker-end="url(#ah)"/>
  <path class="arrow" d="M840,136 L840,194" marker-end="url(#ah)"/>
  <path class="arrow" d="M738,246 L704,246" marker-end="url(#ah)"/>
  <path class="arrow" d="M498,246 L464,246" marker-end="url(#ah)"/>
  <path class="arrow loop" d="M360,196 L360,138" marker-end="url(#ahl)"/>
  <text class="loop-t" x="368" y="171">new version</text>
</svg>
